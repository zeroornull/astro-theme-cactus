name: Build and Push cactus-nginx Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台 (例如: linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64"
      custom_tag:
        description: "自定义镜像标签"
        required: false

permissions:
  contents: read

jobs:
  quality-check:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: quality-check
    runs-on: ubuntu-latest
    env:
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU (可选)
        if: env.PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 获取当前时间戳
        run: echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: 构建并推送 Nginx 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cactus-nginx:${{ env.TIMESTAMP }}
            ${{ secrets.DOCKER_USERNAME }}/cactus-nginx:latest
            ${{ inputs.custom_tag && format('{0}/cactus-nginx:{1}', secrets.DOCKER_USERNAME, inputs.custom_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
